# Errata for Helmlab 2026.
# Identifiers are permanent. The classes K1-K5 are defined in spec.md, Section 11.
# Outputs of Helmlab 2026 never change; an erratum documents behaviour or corrects text.

- id: E-2026-0001
  title: The paper's description of the neutral correction (Stage 10) differs from the reference code
  class: K2
  status: documented
  outputs_changed: false
  reported: 2026-10-19
  reported_by: dy (GitHub)
  source: https://github.com/helmlab-space/helmlab/issues/4
  summary: >-
    The paper (arXiv:2602.23010) describes the neutral correction with 384 grey
    levels for Y from 0.001 to 2.59. The reference code uses 255 grey levels and
    holds the correction constant above L = 1.341; the JavaScript table ends with
    three extension points at L = 1.351, 1.361 and 2.59. The grey chroma above
    diffuse white listed in spec.md, Section 10, follows from this. The reference
    code governs.

- id: E-2026-0002
  title: The paper's account of the MetricSpace fitting data is incomplete
  class: K2
  status: documented
  outputs_changed: false
  reported: 2026-11-12
  reported_by: maintainer
  source: the fitting script of MetricSpace v21
  summary: >-
    The paper (arXiv:2602.23010) says MetricSpace was trained on COMBVD and
    cross-validated on He et al. 2022 and MacAdam 1974, and calls MacAdam 1974
    held-out. The v21 parameters were fitted to a weighted sum of STRESS on
    COMBVD (weight 0.55), MacAdam 1974 (0.15) and the Human Feedback data
    (0.30), so results on all three are in-sample. spec.md, Section 5.6, lists
    the fitting data.
